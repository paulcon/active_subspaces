# Read the Docs configuration (spec 15 §5.7)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # pip >= 25.1 installs PEP 735 dependency groups with --group
      - python -m pip install --upgrade "pip>=25.1"
      - python -m pip install --group docs .

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
